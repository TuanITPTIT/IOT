<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>IoT Sensor System | Action History</title>
  <link rel="stylesheet" href="../css/common.css?v=20261007-3">
  <link rel="stylesheet" href="../css/history.css?v=20261007-3">
</head>
<body data-page="history">
  <div class="app-shell">
    <header class="app-header">
      <a class="app-logo" href="dashboard.html">IoT Tuan Le Quoc <span aria-hidden="true">⌂</span></a>
      <nav class="nav-menu">
        <a href="dashboard.html">Dashboard</a>
        <a href="data.html">Data</a>
        <a class="active" href="history.html">History</a>
        <a href="profile.html">Profile</a>
      </nav>
      <button id="logoutBtn" class="logout-outline sidebar-logout" type="button">Đăng xuất</button>
    </header>

    <main class="page-main">
      <section class="panel filter-panel">
        <div class="history-title-row">
          <h1>Action History</h1>
          <label class="search-wide">
            <input id="timeFilter" name="time" form="historyFilterForm" type="text" placeholder="Tìm kiếm theo thời gian" autocomplete="off">
          </label>
          <button id="searchBtn" class="primary-btn search-btn" type="submit" form="historyFilterForm">Search</button>
          <button id="resetHistoryBtn" class="reset-btn" type="button">Reset</button>
        </div>
        <form id="historyFilterForm" class="filter-form">
          <label>
            <span>Device: All</span>
            <select name="deviceName">
              <option value="">All Devices</option>
              <option value="Temperature">Temperature</option>
              <option value="Luminosity">Luminosity</option>
              <option value="Humidity">Humidity</option>
            </select>
          </label>
          <label>
            <span>Action: All</span>
            <select name="action">
              <option value="">All Actions</option>
              <option value="ON">ON</option>
              <option value="OFF">OFF</option>
            </select>
          </label>
          <label>
            <span>Status: All</span>
            <select name="status">
              <option value="">All Statuses</option>
              <option value="ON">ON</option>
              <option value="OFF">OFF</option>
              <option value="Loading">Loading</option>
              <option value="Failed">Failed</option>
            </select>
          </label>
        </form>
      </section>

      <section class="panel table-panel">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Mã thiết bị</th>
                <th>Thiết bị</th>
                <th>Action</th>
                <th>Trạng thái</th>
                <th>Thời gian</th>
              </tr>
            </thead>
            <tbody id="historyRows"></tbody>
          </table>
        </div>
        <div id="historyPagination" class="pagination"></div>
      </section>
      <p id="historySummary" class="summary-bottom">0 thao tác</p>
    </main>
  </div>

  <script src="../js/config.js?v=20261007-3"></script>
  <script src="../js/common.js?v=20261007-3"></script>
  <script src="../js/history.js?v=20261007-3"></script>
</body>
</html>
